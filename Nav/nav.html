
<!-- Nav -->
<head>


<style>
#burger-toggle {display: none;}

@media (min-width: 701px) {
    .menu {
        display: block;
        flex-direction: block;
        justify-content: center;
        list-style-type: none;
    }
    .menu li {padding-right: 4rem}
  }

@media (max-width: 700px) {
    .menu {
        list-style-type: none;
        position: sticky;
        padding-left: 0px;
        display: none;
    }

    .menu-icon {
        display: block;
        background-image: url(https://media.snl.no/media/8590/standard_oslo.png);
        background-size: cover;
        height: 40px;
        width: 40px;
    }

    .hamburger-toggle-container {cursor: pointer}

    /** Hide the menu**/
    .menu li {
        height: 0px;
        overflow: hidden;
    
    } 
    /* Usikker på de neste 2 linjene er nødvendig */
      #burger-toggle:checked ~ .menu {
          display: block; /* Viser menyen når checkboxen er sjekket */

    }

    #burger-toggle:checked ~ .menu li {
        height: 1rem;
        width: auto;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        padding-bottom: 0.5rem;
    }

    .nav{
        display: flex;
        height: 40px;
        background-color: black;
    }
    .nav a{
      color: #FFFF00;
      text-decoration: none;
      display: block;
    }
    .nav a:hover{
      background-color: #b5b52ce9;
    }
}
.Oslomet-logo{
  height: 40px;
  width: auto;

}
</style>



</head>

        <nav>

                    id="logo">
                </img>
            </a>    
    
            <input id= "burger-toggle" type="checkbox">
            <label class="hamburger-toggle-container" for="burger-toggle">
                <div class="menu-icon"></div>
            </label>

            <ul class="menu">
                <li> Menu 1</li>
                <li> Menu 2</li>
                <li> Menu 3</li>
                <li> Menu 4</li>
