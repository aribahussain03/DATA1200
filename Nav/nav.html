<!DOCTYPE html>
<html>

<head>
    <!-- Meta tag sikrer at nettsiden er responsiv og tilpasser seg etter skjermbredden -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
        
/** Hamburger menu **/

/* Skjuler avkrysningsboksen som brukes til å styre hamburger-menyen */
#burger-toggle{display: none;}

/* Stiler for navigasjonsbaren */
nav {
    margin: 0;
    padding: 0;
    background-color: black;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 80px;
}

/* Bestemmer paddingen for OsloMet logoen i nav*/
a {
            padding-left: 20px;
            padding-right: 20px;
}

/* Desktop visning: Stiler som gjelder når skjermbredder er 701px eller større */
@media (min-width:701px) {
    .menu {
        display: flex;
        flex-direction: row;
        justify-content: center;
        list-style-type: none;
    }

    .menu li {padding-right: 4rem;}
}

/* Mobile view */
@media (max-width: 700px) {
    .menu {
        list-style-type: none;
        position: absolute; /* Bruker absolutt posisjonering på menyen */
        top: 80px; /* Plasserer menyen rett under navigasjonsbaren */
        left: 0;
        right: 0;
        background-color: black;
        display: none; /* Skjuler menyen som standard */
        
    
/*
        list-style-type: none;
        position: sticky;
        padding-left: 0px;
        display: none; */
    }

    /* Definerer stilene for hamburger-ikonet i mobilversjon.*/
    .menu-icon{
        display: block;
        background-image: url(media/menuIkon-gul.png);
        background-size: contain;
        width: 40px;
        height: 40px;
        margin-left: 20px;
        margin-right: 20px;     
        
    }
     /* Viser menyen når avkrysningsboksen for hamburger.menyen er valgt */
    #burger-toggle:checked ~ .menu {
                display: block;
    }

    /* Definerer stilen for containeren rundt hamburger-ikonet*/
        .hamburger-toggle-container {
        cursor: pointer;
        position: relative;
    }

    /* Stil for listeelementet i menyen på mobil*/
    .menu li {
        height: auto;
        overflow: visible;
        padding: 10px 0;
        /* height: 0px;
        overflow: hidden;
        transition: height 0.5s ease; */
    }

    /* Stilen som gjelder dersom menyen er aktiv på mobil*/
    #burger-toggle:checked ~ .menu li{
        height: 1rem;
        width: auto;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        padding-bottom: 2rem;
    }
}

/* Stilen for de lenkene som er meny alternativene*/
.menu a {
    color: #FFFF00;
    text-decoration: none;
    padding: 15px;
    display: block;
    text-align: center;
}

/* Endrer tekst- og bakgrunnsfarge ved hover */
.menu a:hover{
    background-color: #FFFF00;
    color: black;
}

    </style>
</head>

<body>
    <!-- Her starter html for navigasjonsfeltet. -->
<header>
    <nav>

        <a href="OsloMet-logo" >
            <img
                width="90"
                height="50"
                src="media/OsloMet-gulLogo.png"
                id="logo"
                alt="OsloMet logo">
        </a>  

        <input id="burger-toggle" type="checkbox">
        <label class="hamburger-toggle-container" for="burger-toggle">
            <div class="menu-icon"></div>
        </label>
        <ul class="menu">
            <li><a href="index.html">Index</a></li>
            <li><a href="accessibility.html">Accessibility</a></li>
            <li><a href="Github.html">Github</a></li>
            <li><a href="Activity.html">Activity</a></li>
        </ul>
    </nav>
</header>

</body>

</html>
